<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="navyPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="100%" stop-color="#2D5BFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="header">
    <rect x="0" y="0" width="1280" height="214" fill="url(#navyPlane)"/>
    <rect x="60" y="36" width="182" height="32" rx="4" fill="#2D5BFF"/>
    <text x="151" y="58" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">1. 문제 정의 · 현실</text>
    <text x="60" y="118" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">거래 사기 · 부품 털이 · AI 명령 거부, 하드웨어를 믿을 근거 부재</text>
    <rect x="60" y="138" width="1160" height="52" rx="4" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="84" y="173" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">사진과 말만 믿고 사는 중고 IT, 통제 밖에서 움직이는 AI, 멈추고 나서야 아는 서버</text>
  </g>

  <g id="case-1">
    <rect x="60" y="234" width="272" height="430" rx="4" fill="#F1F3FA"/>
    <image href="../images/image-2-2.jpg" x="72" y="246" width="248" height="139" preserveAspectRatio="xMidYMid meet"/>
    <text x="72" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">중고거래로 맥북 샀는데</text>
    <text x="72" y="458" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">KBS 자막뉴스 · 2024.03.13
      <tspan x="72" dy="20">youtube.com/</tspan><tspan x="72" dy="20">watch?v=aCLYk93TMWw</tspan>
    </text>
    <rect x="72" y="516" width="132" height="30" rx="4" fill="#2D5BFF"/>
    <text x="138" y="537" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">중고 거래 사기</text>
    <text x="72" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#2D5BFF">2.3배</text>
    <text x="72" y="630" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">동일 사양 중고 노트북
      <tspan x="72" dy="22">매입처별 사정가 편차</tspan>
    </text>
  </g>

  <g id="case-2">
    <rect x="356" y="234" width="272" height="430" rx="4" fill="#F1F3FA"/>
    <image href="../images/image-2-3.jpg" x="368" y="246" width="248" height="139" preserveAspectRatio="xMidYMid meet"/>
    <text x="368" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">램값이 금값, 중고
      <tspan x="368" dy="22">거래에 PC 털이까지</tspan>
    </text>
    <text x="368" y="458" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">SBS 뉴스 · 2026
      <tspan x="368" dy="20">youtube.com/</tspan><tspan x="368" dy="20">watch?v=QW3PfvUsnM0</tspan>
    </text>
    <rect x="368" y="516" width="132" height="30" rx="4" fill="#1E2188"/>
    <text x="434" y="537" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">부품 빼돌리기</text>
    <text x="368" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">40~50만 대</text>
    <text x="368" y="630" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">연간 중고 노트북 유통
      <tspan x="368" dy="22">성능 기준 가격 없음</tspan>
    </text>
  </g>

  <g id="case-3">
    <rect x="652" y="234" width="272" height="430" rx="4" fill="#F1F3FA"/>
    <image href="../images/image-2-4.jpg" x="664" y="246" width="248" height="139" preserveAspectRatio="xMidYMid meet"/>
    <text x="664" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">AI, 명령 거부 + 코드 조작까지</text>
    <text x="664" y="458" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">YTN · 2025.05
      <tspan x="664" dy="20">youtube.com/</tspan><tspan x="664" dy="20">watch?v=NsTJt3sEoW8</tspan>
    </text>
    <rect x="664" y="516" width="122" height="30" rx="4" fill="#1E2188"/>
    <text x="725" y="537" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">AI 통제 이탈</text>
    <text x="664" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">2025.05</text>
    <text x="664" y="630" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">AI의 종료 지시 거부
      <tspan x="664" dy="22">첫 사례 보고(YTN 보도)</tspan>
    </text>
  </g>

  <g id="case-4">
    <rect x="948" y="234" width="272" height="430" rx="4" fill="#F1F3FA"/>
    <image href="../images/image-2-5.jpg" x="960" y="246" width="248" height="139" preserveAspectRatio="xMidYMid meet"/>
    <text x="960" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">정부 시스템 647개 중단</text>
    <text x="960" y="458" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">SBS 8뉴스 · 2025.09.27
      <tspan x="960" dy="20">youtube.com/</tspan><tspan x="960" dy="20">watch?v=cpbq9fR_4Bw</tspan>
    </text>
    <rect x="960" y="516" width="142" height="30" rx="4" fill="#1E2188"/>
    <text x="1031" y="537" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">전산 인프라 마비</text>
    <text x="960" y="600" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">647개</text>
    <text x="960" y="630" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">2025.09 화재로 중단된
      <tspan x="960" dy="22">정부 업무 시스템(SBS 보도)</tspan>
    </text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: KBS News·SBS 뉴스·YTN 유튜브(각 영상 제목·화면 인용), 당사 시장 조사(2026.08)</text>
    <image href="../images/sp_navy.png" x="1130" y="680" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">02</text>
  </g>
</svg>
