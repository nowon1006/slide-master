<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending">
  <defs>
    <linearGradient id="navyPlane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="100%" stop-color="#2D5BFF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="ask-plane">
    <rect x="0" y="0" width="660" height="720" fill="url(#navyPlane)"/>
    <rect x="60" y="36" width="254" height="32" rx="4" fill="#2D5BFF"/>
    <text x="187" y="58" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">10. 투자 제안 · 라운드 개요</text>
    <text x="60" y="118" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">Seed 3억 원(TIPS 연계 포함
      <tspan x="60" dy="50">총 10억 원) 투자 유치</tspan>
    </text>
    <rect x="60" y="190" width="560" height="78" rx="4" fill="#FFFFFF" fill-opacity="0.14"/>
    <text x="80" y="222" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">24개월 내 전국 3개 거점 · 입점 파트너 30개사 ·
      <tspan x="80" dy="32">2028년 매출 약 24억 원</tspan>
    </text>
  </g>

  <g id="terms">
    <text x="60" y="302" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#5CD0FF">투자 조건</text>
    <rect x="60" y="314" width="560" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="80" y="342" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#5CD0FF">라운드</text>
    <text x="232" y="344" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">Seed</text>
    <rect x="60" y="364" width="560" height="60" rx="4" fill="#F1CE36"/>
    <text x="80" y="400" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">투자 유치 금액</text>
    <text x="232" y="411" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">3억 원</text>
    <rect x="60" y="430" width="560" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="80" y="458" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#5CD0FF">TIPS 연계 포함</text>
    <text x="232" y="460" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">총 10억 원</text>
    <rect x="60" y="480" width="560" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="80" y="508" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#5CD0FF">밸류에이션</text>
    <text x="232" y="510" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">협의(IP 가치평가 24.18억 원 참고)</text>
    <rect x="60" y="530" width="560" height="44" rx="4" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="80" y="558" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#5CD0FF">정부 매칭</text>
    <text x="232" y="560" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">강원권 LIPS 별도 병행</text>
  </g>

  <g id="shareholders">
    <rect x="60" y="586" width="560" height="90" rx="4" fill="#2D5BFF"/>
    <text x="80" y="612" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#F1CE36">주주 구성</text>
    <text x="80" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#FFFFFF">대표이사 김창선 및 경영진 중심
      <tspan x="80" dy="26">(지분율·기존 투자사는 기업 확인 후 기재)</tspan>
    </text>
  </g>

  <g id="goals-head">
    <use data-icon="chunk-filled/chart-line" x="700" y="40" width="28" height="28" fill="#2D5BFF"/>
    <text x="738" y="64" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">24개월 목표</text>
  </g>

  <g id="goal-1">
    <rect x="700" y="88" width="520" height="120" rx="4" fill="#2D5BFF"/>
    <polygon points="1160,108 1184,96 1208,108 1184,120" fill="#F1CE36"/>
    <polygon points="1160,108 1184,120 1184,144 1160,132" fill="#5CD0FF"/>
    <polygon points="1184,120 1208,108 1208,132 1184,144" fill="#1E2188"/>
    <text x="724" y="146" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">매출 33억 원</text>
    <text x="724" y="176" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">향후 2개년 누적(중고·신품 IT 기기 거래,
      <tspan x="724" dy="22">피지컬 AI 진단 수수료)</tspan>
    </text>
  </g>

  <g id="goal-2">
    <rect x="700" y="220" width="520" height="120" rx="4" fill="#F1F3FA"/>
    <text x="724" y="278" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">월 5,000건</text>
    <text x="724" y="308" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">전국 다자간 안심거래 플랫폼 확대,
      <tspan x="724" dy="22">파트너사 5개사 이상 정식 계약</tspan>
    </text>
  </g>

  <g id="goal-3">
    <rect x="700" y="352" width="520" height="120" rx="4" fill="#F1F3FA"/>
    <text x="724" y="410" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">베타 출시</text>
    <text x="724" y="446" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">피지컬 AI 3D 이상 추적·비상대응망</text>
  </g>

  <g id="goal-4">
    <rect x="700" y="484" width="520" height="120" rx="4" fill="#F1F3FA"/>
    <text x="724" y="542" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#1E2188">Pre-A 20억 원</text>
    <text x="724" y="578" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">상용화 실적 기반 후속 투자 유치</text>
  </g>

  <g id="footer">
    <text x="700" y="636" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: 당사 제안 기준(도전의 IR 발표 자료, 2026.11) ·
      <tspan x="700" dy="20">밸류에이션·투자 조건은 협의,</tspan><tspan x="700" dy="20">주주 구성은 기업 확인 필요</tspan>
    </text>
    <image href="../images/sp_navy.png" x="1130" y="680" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">23</text>
  </g>
</svg>
