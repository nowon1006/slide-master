<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="coverField" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="62%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#6FA8FF"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CD0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5CD0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#6FA8FF" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="cardLift" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E2188" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#coverField)"/>

  <g id="glass-rings" data-pptx-role="decoration">
    <circle cx="1100" cy="300" r="230" fill="url(#bloom)"/>
    <circle cx="1040" cy="370" r="330" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="1040" cy="370" r="250" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle cx="1040" cy="370" r="170" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="760" cy="650" r="72" fill="url(#orb)"/>
    <circle cx="1236" cy="650" r="40" fill="url(#orb)"/>
  </g>

  <g id="brand-bar">
    <image href="../images/sp_white.png" x="60" y="44" width="120" height="70" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="82" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">IR DECK  |  2026. 11</text>
  </g>

  <g id="headline">
    <text x="60" y="232" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" fill-opacity="0.82">구간 가속 진단 기술이 적용된</text>
    <text x="60" y="312" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="60" font-weight="bold" fill="#FFFFFF">컴퓨터·AI 반도체 성능 인증과
      <tspan x="60" dy="78">평생관리 에이전트, 딥스펙</tspan>
    </text>
  </g>

  <g id="process-chips">
    <rect x="60" y="446" width="96" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="108" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">측정</text>
    <text x="174" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" fill-opacity="0.75">→</text>
    <rect x="192" y="446" width="160" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="272" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">6등급 판정</text>
    <text x="370" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" fill-opacity="0.75">→</text>
    <rect x="388" y="446" width="168" height="48" rx="24" fill="#FFFFFF" fill-opacity="0.20"/>
    <text x="472" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">시험성적서</text>
    <text x="574" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF" fill-opacity="0.75">→</text>
    <rect x="592" y="446" width="148" height="48" rx="24" fill="#FFFFFF"/>
    <text x="666" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#2D5BFF">평생관리</text>
  </g>

  <g id="product-line">
    <text x="60" y="552" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.88">DeepSpec Auto v3.1 · DeepSpec Agent 2종 ·
      <tspan x="60" dy="36">강원대 4개 캠퍼스 안심거래 플랫폼</tspan>
    </text>
  </g>

  <g id="company-line">
    <text x="60" y="672" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.85">솔포스 주식회사  |  대표이사 김창선  |  www.deepspec.kr</text>
  </g>

  <g id="product-card">
    <rect x="900" y="140" width="320" height="452" rx="28" fill="url(#glassPanel)" filter="url(#cardLift)"/>
    <image href="../images/image-1-2.png" x="920" y="160" width="280" height="273" preserveAspectRatio="xMidYMid meet"/>
    <rect x="948" y="456" width="224" height="114" rx="20" fill="#FFFFFF"/>
    <image href="../images/ds_logo.png" x="970" y="466" width="180" height="94" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
