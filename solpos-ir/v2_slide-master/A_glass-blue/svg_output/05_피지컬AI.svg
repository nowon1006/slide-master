<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="keyBand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="65%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#6FA8FF"/>
    </linearGradient>
    <linearGradient id="enginePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="60%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#6FA8FF"/>
    </linearGradient>
    <radialGradient id="bloom" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5CD0FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#5CD0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardRest" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E2188" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#F6F8FF"/>

  <g id="ambient" data-pptx-role="decoration">
    <circle cx="1250" cy="20" r="200" fill="url(#bloom)" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="60" y="40" width="238" height="34" rx="17" fill="#2D5BFF"/>
    <text x="179" y="63" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4. 기술 · 피지컬 AI 확장</text>
    <text x="60" y="126" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1E2188">동일 엔진으로 로봇 연산장치(ARM)까지 진단</text>
  </g>

  <g id="core-message">
    <rect x="60" y="146" width="1160" height="84" rx="28" fill="url(#keyBand)"/>
    <text x="88" y="181" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">NVIDIA Jetson Orin NX·Raspberry Pi 실측 완료 ·
      <tspan x="88" dy="34">x86에서 ARM 기반 피지컬 AI 장비로 적용 범위 확대</tspan>
    </text>
  </g>

  <g id="evidence-jetson">
    <rect x="60" y="246" width="234" height="274" rx="20" fill="#FFFFFF" filter="url(#cardRest)"/>
    <image href="../images/image-12-2.png" x="72" y="258" width="210" height="196" preserveAspectRatio="xMidYMid meet"/>
    <text x="177" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">Jetson Orin NX
      <tspan x="177" dy="22">코어별 부하 시험</tspan>
    </text>
  </g>

  <g id="evidence-csv">
    <rect x="306" y="246" width="238" height="274" rx="20" fill="#FFFFFF" filter="url(#cardRest)"/>
    <image href="../images/image-12-3.png" x="318" y="258" width="214" height="196" preserveAspectRatio="xMidYMid meet"/>
    <text x="425" y="478" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">응답 CSV 모니터링
      <tspan x="425" dy="22">(Raspberry Pi)</tspan>
    </text>
  </g>

  <g id="evidence-turtlebot">
    <rect x="556" y="246" width="220" height="274" rx="20" fill="#FFFFFF" filter="url(#cardRest)"/>
    <image href="../images/image-12-4.png" x="568" y="258" width="196" height="196" preserveAspectRatio="xMidYMid meet"/>
    <text x="666" y="489" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">TurtleBot3 실증 장비</text>
  </g>

  <g id="vital-meter">
    <rect x="60" y="532" width="716" height="132" rx="20" fill="#FFFFFF" filter="url(#cardRest)"/>
    <image href="../images/image-12-5.png" x="78" y="556" width="224" height="84" preserveAspectRatio="xMidYMid meet"/>
    <text x="322" y="588" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">바이탈 미터:
      <tspan x="322" dy="32">온도·전력·GPU·CPU 사용률 실시간 표시</tspan>
    </text>
  </g>

  <g id="ai-engine">
    <rect x="800" y="246" width="420" height="212" rx="24" fill="url(#enginePanel)"/>
    <circle cx="1180" cy="270" r="70" fill="#FFFFFF" fill-opacity="0.08"/>
    <use data-icon="phosphor-duotone/cpu" x="822" y="262" width="28" height="28" fill="#FFFFFF"/>
    <text x="860" y="284" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">AI 진단 엔진(계획)</text>
    <rect x="818" y="300" width="384" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="836" y="322" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">다중 데이터: CPU·GPU·전력·온도</text>
    <rect x="818" y="338" width="384" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="836" y="360" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">LSTM 오토인코더 + 데이터 융합</text>
    <rect x="818" y="376" width="384" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="836" y="398" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">LIME 기반 특성 기여도 분석</text>
    <rect x="818" y="414" width="384" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.16"/>
    <text x="836" y="436" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">이상 분석 시각화 UI</text>
  </g>

  <g id="three-year">
    <rect x="800" y="470" width="420" height="194" rx="24" fill="#FFFFFF" filter="url(#cardRest)"/>
    <use data-icon="phosphor-duotone/rocket-launch" x="822" y="486" width="28" height="28" fill="#2D5BFF"/>
    <text x="860" y="508" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">3개년 확장</text>
    <rect x="818" y="522" width="384" height="40" rx="14" fill="#F6F8FF"/>
    <text x="836" y="548" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">가동 패턴 검증, 안전 신뢰도 측정·경고</text>
    <rect x="818" y="568" width="384" height="40" rx="14" fill="#F6F8FF"/>
    <text x="836" y="594" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">로봇 연산력 정규화, 코어 슬립 제어·재배치</text>
    <rect x="818" y="614" width="384" height="40" rx="14" fill="#F6F8FF"/>
    <text x="836" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">3D 단층면 이상 추적, 비상대응망</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: 당사 「피지컬 AI 암코어」 기술 자료(2026.02) · 딥러닝 진단 엔진은 개발 계획</text>
    <image href="../images/sp_navy.png" x="1130" y="680" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">12</text>
  </g>
</svg>
