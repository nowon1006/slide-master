<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="55%" stop-color="#106EB8"/>
      <stop offset="100%" stop-color="#22C3EE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#106EB8"/>
      <stop offset="100%" stop-color="#22C3EE"/>
    </linearGradient>
    <filter id="askGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22C3EE" flood-opacity="0.50"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="ambient">
    <circle cx="1132" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1152" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1172" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1192" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1212" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/>
    <circle cx="1132" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1152" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1172" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1192" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1212" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="60" y="44" width="8" height="8" rx="2" fill="#1E2188"/><rect x="70" y="44" width="8" height="8" rx="2" fill="#106EB8"/><rect x="60" y="54" width="8" height="8" rx="2" fill="#22C3EE"/><rect x="70" y="54" width="8" height="8" rx="2" fill="#1E2188"/>
    <text x="90" y="60" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">10. 투자 제안 · 라운드 개요</text>
    <text x="60" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1E2188">Seed 3억 원(TIPS 연계 포함 총 10억 원) 투자 유치</text>
  </g>

  <g id="core-message">
    <rect x="60" y="142" width="1160" height="56" rx="12" fill="url(#ribbon)"/>
    <text x="84" y="179" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">24개월 내 전국 3개 거점 · 입점 파트너 30개사 · 2028년 매출 약 24억 원</text>
  </g>

  <g id="terms">
    <text x="60" y="246" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">투자 조건</text>
    <rect x="60" y="262" width="560" height="48" rx="12" fill="#EEF3FF"/>
    <text x="84" y="292" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">라운드</text>
    <text x="232" y="294" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">Seed</text>
    <rect x="60" y="318" width="560" height="64" rx="12" fill="#1E2188" filter="url(#askGlow)"/>
    <text x="84" y="356" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#22C3EE">투자 유치 금액</text>
    <text x="232" y="367" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#F1CE36">3억 원</text>
    <rect x="60" y="390" width="560" height="48" rx="12" fill="#EEF3FF"/>
    <text x="84" y="420" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">TIPS 연계 포함</text>
    <text x="232" y="422" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">총 10억 원</text>
    <rect x="60" y="446" width="560" height="48" rx="12" fill="#EEF3FF"/>
    <text x="84" y="476" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">밸류에이션</text>
    <text x="232" y="478" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">협의(IP 가치평가 24.18억 원 참고)</text>
    <rect x="60" y="502" width="560" height="48" rx="12" fill="#EEF3FF"/>
    <text x="84" y="532" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">정부 매칭</text>
    <text x="232" y="534" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">강원권 LIPS 별도 병행</text>
  </g>

  <g id="goals">
    <rect x="660" y="226" width="24" height="24" rx="6" fill="url(#tile)"/>
    <use data-icon="tabler-filled/chart-area-line" x="664" y="230" width="16" height="16" fill="#FFFFFF"/>
    <text x="696" y="246" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">24개월 목표</text>
    <rect x="660" y="262" width="560" height="66" rx="12" fill="url(#ribbon)"/>
    <text x="684" y="304" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">매출 33억 원</text>
    <text x="870" y="290" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">향후 2개년 누적(중고·신품 IT 기기 거래,
      <tspan x="870" dy="22">피지컬 AI 진단 수수료)</tspan>
    </text>
    <rect x="660" y="334" width="560" height="66" rx="12" fill="#EEF3FF"/>
    <text x="684" y="376" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">월 5,000건</text>
    <text x="870" y="362" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">전국 다자간 안심거래 플랫폼 확대,
      <tspan x="870" dy="22">파트너사 5개사 이상 정식 계약</tspan>
    </text>
    <rect x="660" y="406" width="560" height="66" rx="12" fill="#EEF3FF"/>
    <text x="684" y="448" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">베타 출시</text>
    <text x="870" y="445" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">피지컬 AI 3D 이상 추적·비상대응망</text>
    <rect x="660" y="478" width="560" height="66" rx="12" fill="#EEF3FF"/>
    <text x="684" y="520" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">Pre-A 20억 원</text>
    <text x="870" y="517" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">상용화 실적 기반 후속 투자 유치</text>
  </g>

  <g id="closing-band">
    <rect x="0" y="572" width="1280" height="148" fill="url(#ribbon)"/>
    <rect x="1150" y="590" width="18" height="18" rx="4" fill="#22C3EE"/><rect x="1172" y="590" width="18" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.3"/><rect x="1194" y="590" width="18" height="18" rx="4" fill="#F1CE36"/>
    <text x="60" y="606" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#F1CE36">주주 구성</text>
    <text x="60" y="638" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#FFFFFF">대표이사 김창선 및 경영진 중심(지분율·기존 투자사는 기업 확인 후 기재)</text>
    <text x="60" y="690" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#FFFFFF" fill-opacity="0.85">출처: 당사 제안 기준(도전의 IR 발표 자료, 2026.11) · 밸류에이션·투자 조건은 협의, 주주 구성은 기업 확인 필요</text>
  </g>

  <g id="footer">
    <image href="../images/sp_white.png" x="1130" y="676" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="696" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">23</text>
  </g>
</svg>
