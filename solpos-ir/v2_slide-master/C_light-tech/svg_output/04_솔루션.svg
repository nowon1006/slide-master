<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="55%" stop-color="#106EB8"/>
      <stop offset="100%" stop-color="#22C3EE"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#106EB8"/>
      <stop offset="100%" stop-color="#22C3EE"/>
    </linearGradient>
    <filter id="frameLift" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1E2188" flood-opacity="0.20"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="ambient">
    <circle cx="1132" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1152" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1172" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1192" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1212" cy="40" r="3" fill="#22C3EE" fill-opacity="0.15"/>
    <circle cx="1132" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1152" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1172" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1192" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/><circle cx="1212" cy="60" r="3" fill="#22C3EE" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="60" y="44" width="8" height="8" rx="2" fill="#1E2188"/><rect x="70" y="44" width="8" height="8" rx="2" fill="#106EB8"/><rect x="60" y="54" width="8" height="8" rx="2" fill="#22C3EE"/><rect x="70" y="54" width="8" height="8" rx="2" fill="#1E2188"/>
    <text x="90" y="60" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#106EB8">3. 솔루션 · 서비스 구조</text>
    <text x="60" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1E2188">PC에 설치해 측정하고, 웹에서 시험성적서 발급</text>
  </g>

  <g id="core-message">
    <rect x="60" y="142" width="1160" height="56" rx="12" fill="url(#ribbon)"/>
    <text x="84" y="179" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF">설치파일 하나로 측정 · 추가 장비 불필요 · 결과는 6등급과 QR 인증 성적서로 제공</text>
  </g>

  <g id="step-1">
    <rect x="60" y="218" width="640" height="76" rx="12" fill="#EEF3FF"/>
    <rect x="78" y="232" width="48" height="48" rx="12" fill="url(#tile)"/>
    <use data-icon="tabler-filled/download" x="88" y="242" width="28" height="28" fill="#FFFFFF"/>
    <text x="146" y="250" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#22C3EE">01</text>
    <text x="180" y="250" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">에이전트 설치</text>
    <text x="146" y="280" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">DeepSpec 에이전트(.msi) 다운로드, 로그인하면 기기 자동 등록</text>
  </g>

  <g id="step-2">
    <rect x="60" y="304" width="640" height="98" rx="12" fill="#EEF3FF"/>
    <rect x="78" y="318" width="48" height="48" rx="12" fill="url(#tile)"/>
    <use data-icon="tabler-filled/gauge" x="88" y="328" width="28" height="28" fill="#FFFFFF"/>
    <text x="146" y="336" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#22C3EE">02</text>
    <text x="180" y="336" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">가속 부하 측정</text>
    <text x="146" y="366" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">사용률 60 → 80 → 100% 구간별로
      <tspan x="146" dy="24">부하를 올리며 속도·온도·연산량 수집</tspan>
    </text>
  </g>

  <g id="step-3">
    <rect x="60" y="412" width="640" height="76" rx="12" fill="#EEF3FF"/>
    <rect x="78" y="426" width="48" height="48" rx="12" fill="url(#tile)"/>
    <use data-icon="tabler-filled/award" x="88" y="436" width="28" height="28" fill="#FFFFFF"/>
    <text x="146" y="444" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#22C3EE">03</text>
    <text x="180" y="444" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">6등급 판정</text>
    <text x="146" y="474" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">24개 품질 지표를 A+ ~ C 6단계 등급으로 환산</text>
  </g>

  <g id="step-4">
    <rect x="60" y="498" width="640" height="76" rx="12" fill="url(#ribbon)"/>
    <rect x="78" y="512" width="48" height="48" rx="12" fill="#FFFFFF"/>
    <use data-icon="tabler-filled/file-text" x="88" y="522" width="28" height="28" fill="#106EB8"/>
    <text x="146" y="530" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#F1CE36">04</text>
    <text x="180" y="530" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">시험성적서 발급</text>
    <text x="146" y="560" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#FFFFFF">웹에서 PDF 성적서 발급, QR로 진위 확인</text>
  </g>

  <g id="use-cases">
    <rect x="60" y="584" width="640" height="80" rx="12" fill="#DDE3F5"/>
    <text x="84" y="632" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">활용처</text>
    <rect x="176" y="595" width="252" height="27" rx="12" fill="#FFFFFF"/>
    <text x="302" y="615" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">중고 거래 가격 기준</text>
    <rect x="436" y="595" width="252" height="27" rx="12" fill="#FFFFFF"/>
    <text x="562" y="615" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">기업 IT 자산 실사</text>
    <rect x="176" y="627" width="252" height="27" rx="12" fill="#FFFFFF"/>
    <text x="302" y="647" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">렌탈 반납 검수</text>
    <rect x="436" y="627" width="252" height="27" rx="12" fill="#FFFFFF"/>
    <text x="562" y="647" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">보험·보증 심사 자료</text>
  </g>

  <g id="platform-panel">
    <rect x="724" y="218" width="496" height="446" rx="12" fill="#EEF3FF"/>
    <rect x="1150" y="600" width="18" height="18" rx="4" fill="#22C3EE"/><rect x="1172" y="600" width="18" height="18" rx="4" fill="#106EB8"/><rect x="1194" y="600" width="18" height="18" rx="4" fill="#1E2188"/>
    <rect x="1172" y="622" width="18" height="18" rx="4" fill="#22C3EE"/><rect x="1194" y="622" width="18" height="18" rx="4" fill="#F1CE36"/>
    <rect x="734" y="236" width="476" height="390" rx="12" fill="#FFFFFF" filter="url(#frameLift)"/>
    <image href="../images/image-6-2.png" x="739" y="241" width="466" height="380" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: deepspec.kr 화면(2026.11)</text>
    <image href="../images/sp_navy.png" x="1130" y="680" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">06</text>
  </g>
</svg>
