    <text x="734" y="511" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">내용</text>
    <text x="1038" y="511" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A1A1A">성과</text>

    <rect x="584" y="524" width="616" height="74" rx="12" fill="#FFFFFF"/>
    <text x="598" y="556" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#2D5BFF">Back Market<tspan x="598" dy="21">(프랑스)</tspan></text>
    <text x="734" y="556" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">리퍼 전자기기 마켓플레이스<tspan x="734" dy="21">등급 검수 기반 거래, 고객 600만 명</tspan></text>
    <text x="1038" y="545" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">2022 시리즈E<tspan x="1038" dy="20">5.1억 달러 유치</tspan><tspan x="1038" dy="20">기업가치 57억 달러</tspan></text>

    <rect x="584" y="602" width="616" height="74" rx="12" fill="#FFFFFF"/>
    <text x="598" y="634" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#2D5BFF">Blancco<tspan x="598" dy="21">(영국)</tspan></text>
    <text x="734" y="634" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">IT 기기 데이터 삭제·진단 SW<tspan x="734" dy="21">ITAD·리퍼 업체 대상</tspan></text>
    <text x="1038" y="623" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">2023 Francisco<tspan x="1038" dy="20">Partners 인수</tspan><tspan x="1038" dy="20">약 1.75억 파운드</tspan></text>
  </g>

  <g id="footer">
    <text x="80" y="704" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#6B6B6B">출처: Back Market 보도자료(2022.01), Francisco Partners 보도자료(2023.12)</text>
