<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <radialGradient id="aiLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9DB8FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9DB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vennA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#2D5BFF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="vennB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DB8FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9DB8FF" stop-opacity="0.20"/>
    </linearGradient>
    <linearGradient id="vennC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E2188" stop-opacity="0.40"/>
      <stop offset="100%" stop-color="#1E2188" stop-opacity="0.10"/>
    </linearGradient>
    <filter id="coreLift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E2188" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#F2F2F2"/>

  <g id="ambient">
    <circle cx="1180" cy="60" r="200" fill="url(#aiLight)" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="80" y="60" width="8" height="8" rx="2" fill="#2D5BFF"/>
    <text x="98" y="69" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#2D5BFF">5. 경쟁 환경 · 성공사례와 차별점</text>
    <text x="80" y="126" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A1A1A">중고 IT 검증·진단 분야, <tspan fill="#2D5BFF">글로벌 대형 투자·인수 사례</tspan></text>
  </g>

  <g id="core-message">
    <rect x="80" y="148" width="1120" height="48" rx="16" fill="#FFFFFF"/>
    <circle cx="102" cy="172" r="5" fill="#2D5BFF"/>
    <text x="118" y="180" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" fill="#1A1A1A">거래 시장이 커질수록 검증 수요 동반 성장 · 검증 기준을 가진 기업이 시장 주도</text>
  </g>

  <g id="venn">
    <rect x="80" y="224" width="480" height="452" rx="24" fill="#FFFFFF"/>
    <text x="104" y="264" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">3가지 핵심 차별점</text>
    <circle cx="262" cy="404" r="106" fill="url(#vennA)"/>
    <circle cx="378" cy="404" r="106" fill="url(#vennB)"/>
    <circle cx="320" cy="504" r="106" fill="url(#vennC)"/>
    <text x="214" y="376" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">가동 중
      <tspan x="214" dy="28">가속 검증</tspan>
    </text>
    <text x="426" y="376" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">등급과
      <tspan x="426" dy="28">성적서</tspan>
    </text>
    <text x="320" y="560" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">특허와 평생
      <tspan x="320" dy="28">이력 데이터</tspan>
    </text>
    <rect x="272" y="410" width="96" height="60" rx="16" fill="#FFFFFF" filter="url(#coreLift)"/>
    <image href="../images/ds_logo.png" x="276" y="414" width="88" height="52" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="callout">
    <rect x="104" y="624" width="432" height="36" rx="18" fill="#2D5BFF"/>
    <text x="320" y="648" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">국내에는 PC·서버 성능을 등급으로 인증하는 사업자 부재</text>
  </g>

  <g id="diff-1">
    <rect x="584" y="224" width="616" height="64" rx="16" fill="#FFFFFF"/>
    <circle cx="616" cy="256" r="16" fill="#2D5BFF"/>
    <text x="616" y="262" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">01</text>
    <text x="648" y="251" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">4단계 부하 가속으로 24개 지표 실측.
      <tspan x="648" dy="21">설치파일 하나로 측정, 별도 장비 불필요</tspan>
    </text>
    <use data-icon="phosphor-duotone/gauge" x="1156" y="244" width="24" height="24" fill="#9DB8FF"/>
  </g>

  <g id="diff-2">
    <rect x="584" y="298" width="616" height="64" rx="16" fill="#FFFFFF"/>
    <circle cx="616" cy="330" r="16" fill="#2D5BFF"/>
    <text x="616" y="336" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">02</text>
    <text x="648" y="325" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">6등급 + QR 인증 시험성적서 자동 발급.
      <tspan x="648" dy="21">중고 거래·자산 실사·보험 심사의 공통 기준으로 사용</tspan>
    </text>
    <use data-icon="phosphor-duotone/certificate" x="1156" y="318" width="24" height="24" fill="#9DB8FF"/>
  </g>

  <g id="diff-3">
    <rect x="584" y="372" width="616" height="64" rx="16" fill="#FFFFFF"/>
    <circle cx="616" cy="404" r="16" fill="#2D5BFF"/>
    <text x="616" y="410" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">03</text>
    <text x="648" y="399" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#1A1A1A">등록 2건·출원 4건, IP 가치 24.18억 원.
      <tspan x="648" dy="21">에이전트로 쌓이는 기기별 이력이 AI 진단 학습 자산</tspan>
    </text>
    <use data-icon="phosphor-duotone/database" x="1156" y="392" width="24" height="24" fill="#9DB8FF"/>
  </g>

  <g id="cases-head">
    <text x="584" y="476" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A1A1A">글로벌 성공사례</text>
  </g>

