    <text x="892" y="505" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">내용</text>
    <text x="1132" y="505" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">성과</text>

    <rect x="604" y="516" width="616" height="72" rx="12" fill="#F4F7FF"/>
    <text x="614" y="547" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">Back Market<tspan x="614" dy="22">(프랑스)</tspan></text>
    <text x="750" y="547" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">리퍼 전자기기 마켓플레이스<tspan x="750" dy="22">등급 검수 기반 거래, 고객 600만 명</tspan></text>
    <text x="1050" y="536" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">2022 시리즈E<tspan x="1050" dy="21">5.1억 달러 유치</tspan><tspan x="1050" dy="21">기업가치 57억 달러</tspan></text>

    <rect x="604" y="592" width="616" height="72" rx="12" fill="#F4F7FF"/>
    <text x="614" y="623" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">Blancco<tspan x="614" dy="22">(영국)</tspan></text>
    <text x="750" y="623" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">IT 기기 데이터 삭제·진단 SW<tspan x="750" dy="22">ITAD·리퍼 업체 대상</tspan></text>
    <text x="1050" y="612" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">2023 Francisco<tspan x="1050" dy="21">Partners 인수</tspan><tspan x="1050" dy="21">약 1.75억 파운드</tspan></text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: Back Market 보도자료(2022.01), Francisco Partners 보도자료(2023.12)</text>
