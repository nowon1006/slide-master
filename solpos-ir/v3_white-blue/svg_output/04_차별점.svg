<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="pointGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#5CD0FF"/>
    </linearGradient>
    <linearGradient id="vennA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2D5BFF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7AA7FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="vennB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5CD0FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7AA7FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="vennC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1E2188" stop-opacity="0.70"/>
      <stop offset="100%" stop-color="#7AA7FF" stop-opacity="0.30"/>
    </linearGradient>
    <linearGradient id="glassOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CD0FF"/>
      <stop offset="100%" stop-color="#2D5BFF"/>
    </linearGradient>
    <filter id="coreLift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1E2188" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="ambient">
    <circle cx="1240" cy="30" r="90" fill="url(#glassOrb)" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="60" y="48" width="24" height="8" rx="4" fill="url(#pointGrad)"/>
    <text x="94" y="58" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">5. 경쟁 환경 · 성공사례와 차별점</text>
    <text x="60" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1E2188">중고 IT 검증·진단 분야, <tspan fill="#2D5BFF">글로벌 대형 투자·인수 사례</tspan></text>
  </g>

  <g id="core-message">
    <rect x="60" y="142" width="1160" height="56" rx="16" fill="#F4F7FF"/>
    <circle cx="88" cy="170" r="8" fill="url(#pointGrad)"/>
    <text x="108" y="179" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">거래 시장이 커질수록 검증 수요 동반 성장 · 검증 기준을 가진 기업이 시장 주도</text>
  </g>

  <g id="venn">
    <rect x="60" y="218" width="520" height="446" rx="24" fill="#F4F7FF"/>
    <text x="84" y="254" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">3가지 핵심 차별점</text>
    <circle cx="258" cy="392" r="112" fill="url(#vennA)"/>
    <circle cx="382" cy="392" r="112" fill="url(#vennB)"/>
    <circle cx="320" cy="496" r="112" fill="url(#vennC)"/>
    <text x="214" y="356" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">가동 중
      <tspan x="214" dy="22">가속 검증</tspan>
    </text>
    <text x="428" y="356" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">등급과
      <tspan x="428" dy="22">성적서</tspan>
    </text>
    <text x="320" y="558" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">특허와 평생
      <tspan x="320" dy="22">이력 데이터</tspan>
    </text>
    <rect x="270" y="402" width="100" height="58" rx="16" fill="#FFFFFF" filter="url(#coreLift)"/>
    <image href="../images/ds_logo.png" x="276" y="405" width="88" height="52" preserveAspectRatio="xMidYMid meet"/>
  </g>

  <g id="callout">
    <rect x="76" y="614" width="488" height="38" rx="19" fill="url(#pointGrad)"/>
    <text x="320" y="639" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">국내에는 PC·서버 성능을 등급으로 인증하는 사업자 부재</text>
  </g>

  <g id="diff-1">
    <rect x="604" y="218" width="616" height="66" rx="16" fill="#F4F7FF"/>
    <circle cx="636" cy="251" r="18" fill="url(#pointGrad)"/>
    <text x="636" y="257" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">01</text>
    <text x="668" y="246" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">4단계 부하 가속으로 24개 지표 실측.
      <tspan x="668" dy="22">설치파일 하나로 측정, 별도 장비 불필요</tspan>
    </text>
    <use data-icon="phosphor-duotone/gauge" x="1180" y="239" width="24" height="24" fill="#2D5BFF"/>
  </g>

  <g id="diff-2">
    <rect x="604" y="292" width="616" height="66" rx="16" fill="#F4F7FF"/>
    <circle cx="636" cy="325" r="18" fill="url(#pointGrad)"/>
    <text x="636" y="331" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">02</text>
    <text x="668" y="320" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">6등급 + QR 인증 시험성적서 자동 발급.
      <tspan x="668" dy="22">중고 거래·자산 실사·보험 심사의 공통 기준으로 사용</tspan>
    </text>
    <use data-icon="phosphor-duotone/certificate" x="1180" y="313" width="24" height="24" fill="#2D5BFF"/>
  </g>

  <g id="diff-3">
    <rect x="604" y="366" width="616" height="66" rx="16" fill="#F4F7FF"/>
    <circle cx="636" cy="399" r="18" fill="url(#pointGrad)"/>
    <text x="636" y="405" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">03</text>
    <text x="668" y="394" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#12152E">등록 2건·출원 4건, IP 가치 24.18억 원.
      <tspan x="668" dy="22">에이전트로 쌓이는 기기별 이력이 AI 진단 학습 자산</tspan>
    </text>
    <use data-icon="phosphor-duotone/database" x="1180" y="387" width="24" height="24" fill="#2D5BFF"/>
  </g>

  <g id="cases-head">
    <text x="604" y="472" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">글로벌 성공사례</text>
  </g>

