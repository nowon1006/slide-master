<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="ending">
  <defs>
    <linearGradient id="pointGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#5CD0FF"/>
    </linearGradient>
    <linearGradient id="askGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="60%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#5CD0FF"/>
    </linearGradient>
    <linearGradient id="numGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E2188"/>
      <stop offset="100%" stop-color="#2D5BFF"/>
    </linearGradient>
    <linearGradient id="glassOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CD0FF"/>
      <stop offset="100%" stop-color="#2D5BFF"/>
    </linearGradient>
    <filter id="askLift" x="-10%" y="-40%" width="120%" height="190%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2D5BFF" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="ambient">
    <circle cx="1240" cy="30" r="90" fill="url(#glassOrb)" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="60" y="48" width="24" height="8" rx="4" fill="url(#pointGrad)"/>
    <text x="94" y="58" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">10. 투자 제안 · 라운드 개요</text>
    <text x="60" y="122" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1E2188"><tspan fill="#2D5BFF">Seed 3억 원</tspan>(TIPS 연계 포함 총 10억 원) 투자 유치</text>
  </g>

  <g id="core-message">
    <rect x="60" y="142" width="1160" height="56" rx="16" fill="#F4F7FF"/>
    <circle cx="88" cy="170" r="8" fill="url(#pointGrad)"/>
    <text x="108" y="179" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#1E2188">24개월 내 전국 3개 거점 · 입점 파트너 30개사 · 2028년 매출 약 24억 원</text>
  </g>

  <g id="terms">
    <text x="60" y="248" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">투자 조건</text>
    <rect x="60" y="262" width="560" height="48" rx="24" fill="#F4F7FF"/>
    <text x="86" y="292" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">라운드</text>
    <text x="232" y="294" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">Seed</text>
    <rect x="60" y="318" width="560" height="66" rx="33" fill="url(#askGrad)" filter="url(#askLift)"/>
    <circle cx="590" cy="334" r="40" fill="#FFFFFF" fill-opacity="0.12"/>
    <text x="86" y="357" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">투자 유치 금액</text>
    <text x="232" y="368" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="48" font-weight="bold" fill="#F1CE36">3억 원</text>
    <rect x="60" y="392" width="560" height="48" rx="24" fill="#F4F7FF"/>
    <text x="86" y="422" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">TIPS 연계 포함</text>
    <text x="232" y="424" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">총 10억 원</text>
    <rect x="60" y="448" width="560" height="48" rx="24" fill="#F4F7FF"/>
    <text x="86" y="478" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">밸류에이션</text>
    <text x="232" y="480" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">협의(IP 가치평가 24.18억 원 참고)</text>
    <rect x="60" y="504" width="560" height="48" rx="24" fill="#F4F7FF"/>
    <text x="86" y="534" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">정부 매칭</text>
    <text x="232" y="536" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#12152E">강원권 LIPS 별도 병행</text>
  </g>

  <g id="goals">
    <rect x="660" y="226" width="26" height="26" rx="8" fill="url(#pointGrad)"/>
    <use data-icon="phosphor-duotone/chart-line-up" x="664" y="230" width="18" height="18" fill="#FFFFFF"/>
    <text x="698" y="248" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">24개월 목표</text>
    <rect x="660" y="262" width="560" height="66" rx="18" fill="#F4F7FF"/>
    <rect x="660" y="262" width="12" height="66" rx="6" fill="url(#pointGrad)"/>
    <text x="690" y="304" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="url(#numGrad)">매출 33억 원</text>
    <text x="874" y="290" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">향후 2개년 누적(중고·신품 IT 기기 거래,
      <tspan x="874" dy="22">피지컬 AI 진단 수수료)</tspan>
    </text>
    <rect x="660" y="334" width="560" height="66" rx="18" fill="#F4F7FF"/>
    <text x="690" y="376" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="url(#numGrad)">월 5,000건</text>
    <text x="874" y="362" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">전국 다자간 안심거래 플랫폼 확대,
      <tspan x="874" dy="22">파트너사 5개사 이상 정식 계약</tspan>
    </text>
    <rect x="660" y="406" width="560" height="66" rx="18" fill="#F4F7FF"/>
    <text x="690" y="448" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="url(#numGrad)">베타 출시</text>
    <text x="874" y="445" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">피지컬 AI 3D 이상 추적·비상대응망</text>
    <rect x="660" y="478" width="560" height="66" rx="18" fill="#F4F7FF"/>
    <text x="690" y="520" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="url(#numGrad)">Pre-A 20억 원</text>
    <text x="874" y="517" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">상용화 실적 기반 후속 투자 유치</text>
  </g>

  <g id="shareholders">
    <rect x="60" y="568" width="1160" height="96" rx="20" fill="#F4F7FF"/>
    <circle cx="1170" cy="616" r="30" fill="url(#glassOrb)"/>
    <circle cx="1128" cy="642" r="12" fill="url(#pointGrad)"/>
    <text x="86" y="604" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">주주 구성</text>
    <text x="86" y="640" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" fill="#1E2188">대표이사 김창선 및 경영진 중심(지분율·기존 투자사는 기업 확인 후 기재)</text>
  </g>

  <g id="footer">
    <text x="60" y="700" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#5B6178">출처: 당사 제안 기준(도전의 IR 발표 자료, 2026.11) · 밸류에이션·투자 조건은 협의, 주주 구성은 기업 확인 필요</text>
    <image href="../images/sp_navy.png" x="1130" y="680" width="48" height="28" preserveAspectRatio="xMidYMid meet"/>
    <text x="1220" y="700" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#2D5BFF">23</text>
  </g>
</svg>
