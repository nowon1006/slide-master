<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="cover">
  <defs>
    <linearGradient id="pageWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F7FF"/>
    </linearGradient>
    <linearGradient id="heroOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5CD0FF"/>
      <stop offset="45%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#1E2188"/>
    </linearGradient>
    <linearGradient id="glassOrb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7AA7FF" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="pointGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D5BFF"/>
      <stop offset="100%" stop-color="#5CD0FF"/>
    </linearGradient>
    <filter id="cardLift" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E2188" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="url(#pageWash)"/>

  <g id="hero-orbs">
    <circle cx="1120" cy="350" r="250" fill="url(#heroOrb)"/>
    <circle cx="1120" cy="350" r="200" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="1120" cy="350" r="140" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle cx="930" cy="600" r="70" fill="url(#glassOrb)"/>
    <circle cx="1235" cy="95" r="38" fill="url(#glassOrb)"/>
    <circle cx="880" cy="150" r="18" fill="url(#pointGrad)"/>
  </g>

  <g id="brand-bar">
    <image href="../images/sp_navy.png" x="60" y="44" width="120" height="70" preserveAspectRatio="xMidYMid meet"/>
    <rect x="60" y="672" width="24" height="8" rx="4" fill="url(#pointGrad)"/>
  </g>

  <g id="headline">
    <text x="60" y="210" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="26" font-weight="bold" fill="#2D5BFF">구간 가속 진단 기술이 적용된</text>
    <text x="60" y="290" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="60" font-weight="bold" fill="#1E2188">컴퓨터·AI 반도체 성능 인증과
      <tspan x="60" dy="78">평생관리 에이전트, </tspan><tspan fill="url(#pointGrad)">딥스펙</tspan>
    </text>
  </g>

  <g id="process-chips">
    <rect x="60" y="414" width="96" height="48" rx="24" fill="#E6EDFF"/>
    <text x="108" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">측정</text>
    <text x="174" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#7AA7FF">→</text>
    <rect x="192" y="414" width="160" height="48" rx="24" fill="#E6EDFF"/>
    <text x="272" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">6등급 판정</text>
    <text x="370" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#7AA7FF">→</text>
    <rect x="388" y="414" width="168" height="48" rx="24" fill="#E6EDFF"/>
    <text x="472" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#1E2188">시험성적서</text>
    <text x="574" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#7AA7FF">→</text>
    <rect x="592" y="414" width="148" height="48" rx="24" fill="url(#pointGrad)"/>
    <text x="666" y="446" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">평생관리</text>
  </g>

  <g id="product-line">
    <text x="60" y="524" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" fill="#5B6178">DeepSpec Auto v3.1 · DeepSpec Agent 2종 ·
      <tspan x="60" dy="36">강원대 4개 캠퍼스 안심거래 플랫폼</tspan>
    </text>
  </g>

  <g id="company-line">
    <text x="96" y="682" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" fill="#5B6178">솔포스 주식회사  |  대표이사 김창선  |  www.deepspec.kr</text>
  </g>

  <g id="ir-tag">
    <rect x="1010" y="44" width="186" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.92"/>
    <text x="1103" y="69" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="18" font-weight="bold" fill="#1E2188">IR DECK  |  2026. 11</text>
  </g>

  <g id="product-card">
    <rect x="930" y="170" width="290" height="380" rx="28" fill="#FFFFFF" fill-opacity="0.92" filter="url(#cardLift)"/>
    <image href="../images/image-1-2.png" x="950" y="188" width="250" height="244" preserveAspectRatio="xMidYMid meet"/>
    <image href="../images/ds_logo.png" x="995" y="443" width="160" height="94" preserveAspectRatio="xMidYMid meet"/>
  </g>
</svg>
