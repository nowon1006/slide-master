  </g>

  <g id="diff-1">
    <rect x="544" y="132" width="64" height="64" rx="0" fill="#0062DF"/>
    <text x="576" y="172" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">01</text>
