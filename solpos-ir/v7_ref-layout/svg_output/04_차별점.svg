  </g>

  <g id="header">
    <text x="640" y="56" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#0062DF">5. 경쟁 환경 · 성공사례와 차별점</text>
    <text x="640" y="104" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A2434">중고 IT 검증·진단 분야, <tspan fill="#0062DF">글로벌 대형 투자·인수 사례</tspan></text>
  </g>

  <g id="venn-head">
