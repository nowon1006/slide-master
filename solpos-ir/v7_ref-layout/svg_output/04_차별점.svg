    <text x="632" y="160" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#1A2434">4단계 부하 가속으로 24개 지표 실측.<tspan x="632" dy="22" font-size="16" font-weight="normal" fill="#565D6A">설치파일 하나로 측정, 별도 장비 불필요</tspan></text>
    <use data-icon="phosphor-duotone/gauge" x="1152" y="148" width="32" height="32" fill="#0062DF"/>
  </g>

  <g id="diff-2">
    <rect x="544" y="204" width="64" height="64" rx="0" fill="#0062DF"/>
    <text x="576" y="244" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">02</text>
    <rect x="608" y="204" width="592" height="64" rx="0" fill="#F4F5F7"/>
    <text x="632" y="232" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#1A2434">6등급 + QR 인증 시험성적서 자동 발급.<tspan x="632" dy="22" font-size="16" font-weight="normal" fill="#565D6A">중고 거래·자산 실사·보험 심사의 공통 기준으로 사용</tspan></text>
    <use data-icon="phosphor-duotone/certificate" x="1152" y="220" width="32" height="32" fill="#0062DF"/>
  </g>

  <g id="diff-3">
    <rect x="544" y="276" width="64" height="64" rx="0" fill="#0062DF"/>
    <text x="576" y="316" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">03</text>
    <rect x="608" y="276" width="592" height="64" rx="0" fill="#F4F5F7"/>
    <text x="632" y="304" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#1A2434">등록 2건·출원 4건, IP 가치 24.18억 원.<tspan x="632" dy="22" font-size="16" font-weight="normal" fill="#565D6A">에이전트로 쌓이는 기기별 이력이 AI 진단 학습 자산</tspan></text>
    <use data-icon="phosphor-duotone/database" x="1152" y="292" width="32" height="32" fill="#0062DF"/>
  </g>

