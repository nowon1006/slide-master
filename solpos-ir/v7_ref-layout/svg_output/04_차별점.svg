    <text x="404" y="296" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#1A2434">등급과<tspan x="404" dy="26">성적서</tspan></text>
    <text x="300" y="468" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="20" font-weight="bold" fill="#1A2434">특허와 평생<tspan x="300" dy="26">이력 데이터</tspan></text>
    <rect x="252" y="328" width="96" height="60" rx="4" fill="#FFFFFF"/>
