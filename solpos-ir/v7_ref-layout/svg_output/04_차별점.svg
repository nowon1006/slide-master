<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#003597"/>
      <stop offset="60%" stop-color="#0062DF"/>
      <stop offset="100%" stop-color="#9DB8FF"/>
    </linearGradient>
    <linearGradient id="vennA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0062DF" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0062DF" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="vennB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9DB8FF" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#9DB8FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="vennC" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#003597" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#003597" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>

  <g id="top-bar">
