<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720" width="1280" height="720" data-pptx-page-role="content">
  <defs>
    <radialGradient id="aiLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9DB8FF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9DB8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="statGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0062DF"/>
      <stop offset="100%" stop-color="#9DB8FF"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="720" fill="#E9ECF1"/>

  <g id="ambient">
    <circle cx="1180" cy="60" r="200" fill="url(#aiLight)" fill-opacity="0.15"/>
  </g>

  <g id="header">
    <rect x="80" y="60" width="8" height="8" rx="0" fill="#0062DF"/>
    <text x="98" y="69" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A2434">1. 문제 정의 · 현실</text>
    <text x="80" y="126" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A2434" letter-spacing="-1">거래 사기 · 부품 털이 · AI 명령 거부, <tspan fill="#0062DF">하드웨어를 믿을 근거 부재</tspan></text>
  </g>

  <g id="core-message">
    <rect x="80" y="148" width="1120" height="48" rx="4" fill="#FFFFFF"/>
    <circle cx="102" cy="172" r="5" fill="#0062DF"/>
    <text x="118" y="180" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" fill="#1A2434">사진과 말만 믿고 사는 중고 IT, 통제 밖에서 움직이는 AI, 멈추고 나서야 아는 서버</text>
  </g>

  <g id="case-1">
    <rect x="80" y="224" width="546" height="216" rx="0" fill="#FFFFFF"/>
    <image href="../images/image-2-2.jpg" x="100" y="244" width="171" height="96" preserveAspectRatio="xMidYMid meet"/>
    <rect x="291" y="244" width="128" height="26" rx="4" fill="#0062DF"/>
    <text x="355" y="263" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">중고 거래 사기</text>
    <text x="291" y="298" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A2434">중고거래로 맥북 샀는데</text>
    <text x="291" y="348" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">KBS 자막뉴스 · 2024.03.13
      <tspan x="291" dy="21">youtube.com/watch?v=aCLYk93TMWw</tspan>
    </text>
    <text x="100" y="420" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="url(#statGrad)">2.3배</text>
    <text x="340" y="396" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">동일 사양 중고 노트북
      <tspan x="340" dy="21">매입처별 사정가 편차</tspan>
    </text>
  </g>

  <g id="case-2">
    <rect x="654" y="224" width="546" height="216" rx="0" fill="#FFFFFF"/>
    <image href="../images/image-2-3.jpg" x="674" y="244" width="171" height="96" preserveAspectRatio="xMidYMid meet"/>
    <rect x="865" y="244" width="122" height="26" rx="4" fill="#F4F5F7"/>
    <text x="926" y="263" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A2434">부품 빼돌리기</text>
    <text x="865" y="298" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A2434">램값이 금값, 중고 거래에 PC 털이까지</text>
    <text x="865" y="348" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">SBS 뉴스 · 2026
      <tspan x="865" dy="21">youtube.com/watch?v=QW3PfvUsnM0</tspan>
    </text>
    <text x="674" y="420" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A2434">40~50만 대</text>
    <text x="914" y="396" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">연간 중고 노트북 유통
      <tspan x="914" dy="21">성능 기준 가격 없음</tspan>
    </text>
  </g>

  <g id="case-3">
    <rect x="80" y="460" width="546" height="216" rx="0" fill="#FFFFFF"/>
    <image href="../images/image-2-4.jpg" x="100" y="480" width="171" height="96" preserveAspectRatio="xMidYMid meet"/>
    <rect x="291" y="480" width="112" height="26" rx="4" fill="#F4F5F7"/>
    <text x="347" y="499" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A2434">AI 통제 이탈</text>
    <text x="291" y="534" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A2434">AI, 명령 거부 + 코드 조작까지</text>
    <text x="291" y="584" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">YTN · 2025.05
      <tspan x="291" dy="21">youtube.com/watch?v=NsTJt3sEoW8</tspan>
    </text>
    <text x="100" y="656" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A2434">2025.05</text>
    <text x="340" y="632" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">AI의 종료 지시 거부
      <tspan x="340" dy="21">첫 사례 보고(YTN 보도)</tspan>
    </text>
  </g>

  <g id="case-4">
    <rect x="654" y="460" width="546" height="216" rx="0" fill="#FFFFFF"/>
    <image href="../images/image-2-5.jpg" x="674" y="480" width="171" height="96" preserveAspectRatio="xMidYMid meet"/>
    <rect x="865" y="480" width="134" height="26" rx="4" fill="#F4F5F7"/>
    <text x="932" y="499" text-anchor="middle" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A2434">전산 인프라 마비</text>
    <text x="865" y="534" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="22" font-weight="bold" fill="#1A2434">정부 시스템 647개 중단</text>
    <text x="865" y="584" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">SBS 8뉴스 · 2025.09.27
      <tspan x="865" dy="21">youtube.com/watch?v=cpbq9fR_4Bw</tspan>
    </text>
    <text x="674" y="656" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="40" font-weight="bold" fill="#1A2434">647개</text>
    <text x="914" y="632" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">2025.09 화재로 중단된
      <tspan x="914" dy="21">정부 업무 시스템(SBS 보도)</tspan>
    </text>
  </g>

  <g id="footer">
    <text x="80" y="704" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" fill="#565D6A">출처: KBS News·SBS 뉴스·YTN 유튜브(각 영상 제목·화면 인용), 당사 시장 조사(2026.08)</text>
    <image href="../images/sp_navy.png" x="1114" y="686" width="44" height="26" preserveAspectRatio="xMidYMid meet"/>
    <text x="1200" y="704" text-anchor="end" font-family="Pretendard, 'Malgun Gothic', sans-serif" font-size="16" font-weight="bold" fill="#1A2434">02</text>
  </g>
</svg>
